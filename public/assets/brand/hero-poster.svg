<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".58" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#e5eef7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a71f3"/>
      <stop offset=".72" stop-color="#1752c5"/>
      <stop offset="1" stop-color="#123b8c"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="32" stdDeviation="34" flood-color="#174f9d" flood-opacity=".35"/>
    </filter>
    <pattern id="grid" width="205" height="205" patternUnits="userSpaceOnUse" patternTransform="rotate(-33)">
      <rect x="10" y="10" width="185" height="185" rx="30" fill="#ffffff" fill-opacity=".22" stroke="#ffffff" stroke-opacity=".58" stroke-width="3"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#72dcff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#72dcff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="1120" cy="450" rx="540" ry="390" fill="url(#glow)"/>
  <rect x="570" y="250" width="1150" height="850" fill="url(#grid)" opacity=".84"/>
  <g transform="translate(1065 470) rotate(-7)" filter="url(#shadow)">
    <rect x="-160" y="-110" width="320" height="220" rx="58" fill="url(#tile)" stroke="#8ccaff" stroke-width="5"/>
  </g>
</svg>
